# ───────────────────────────────────────────────────────────────────────────────
# XeltaCraft — Gradle Performance Properties
# These settings keep the Gradle daemon alive and reusable between runs,
# which eliminates the ~30s JVM cold-start cost on every runClient.
# ───────────────────────────────────────────────────────────────────────────────

# Keep the daemon alive longer (default is 3 hours, this is explicit)
org.gradle.daemon=true
org.gradle.daemon.idletimeout=10800000

# Give the build JVM enough heap for NeoForge's heavy toolchain setup
org.gradle.jvmargs=-Xmx3g -Xms1g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Run tasks in parallel where possible (safe for independent sub-projects)
org.gradle.parallel=true

# Configuration cache is NOT compatible with NeoForge moddev plugin — keep disabled
org.gradle.configuration-cache=false
# org.gradle.configuration-cache.problems=warn  (disabled)

# Increase Gradle's worker count to use more CPU cores during compilation
org.gradle.workers.max=4

# Mod properties
mod_id=xeltacraft
mod_name=XeltaCraft
mod_version=1.0.0
